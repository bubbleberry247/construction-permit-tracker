    regex_patterns:
      permit_number_paren: ['許可\s*[（(]\s*[般特]\s*[–\-―—ー]+\s*\d+', 4.0]
      permit_number_strict: ['(般|特)[–\-―—ー\s]*\d+\)?\s*第\s*\d+\s*号', 4.0]
      law_article: ['建設業法\s*第\s*3\s*条', 3.0]
