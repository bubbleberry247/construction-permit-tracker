# 書類フィンガープリント v1.1 (横断データ分析ベース)
# 生成: 2026-04-30 15:10 - data/fingerprint_analysis_20260430_151008.{json,md}
# 各キーワードは:
#   in_rate ≥ 0.7  (クラス内含有率) かつ
#   discriminative ≥ 0.4 (in_rate - out_rate)
# を満たすものを selected。
#
# スコアリング:
#   heading_match (top 200 chars):  +3.0  (1 ヒット限定)
#   required_keyword (each):        +1.5
#   support_keyword  (each):        +0.5  (上限 5 ヒット = 2.5 点)
#   regex_pattern (各 regex の score):
#   negative_keyword (each):        -1.0
# confidence = clip( (score - min_score) / divisor + floor, floor, ceiling )
#   ただし score < min_score なら採用しない

version: "v1.1"

documents:
